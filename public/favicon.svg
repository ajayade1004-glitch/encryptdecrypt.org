<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="70%" stop-color="#030712" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Neon Cyber Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF9D" />
      <stop offset="50%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Glowing Accent -->
    <filter id="cyberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <!-- Rounded App Icon Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="8" />

  <!-- Subtle Cyber Grid in Icon Background -->
  <path d="M 96 0 V 512 M 192 0 V 512 M 288 0 V 512 M 384 0 V 512 M 0 96 H 512 M 0 192 H 512 M 0 288 H 512 M 0 384 H 512" 
        stroke="rgba(0, 240, 255, 0.05)" stroke-width="2" />

  <!-- Outer Cyber Shield Contour -->
  <path d="M 256 64 
           L 416 128 
           C 416 288 352 400 256 448 
           C 160 400 96 288 96 128 
           Z" 
        fill="url(#shieldFill)" 
        stroke="url(#neonGrad)" 
        stroke-width="18" 
        stroke-linejoin="round"
        stroke-linecap="round"
        filter="url(#cyberGlow)" />

  <!-- Inner Cyber Terminal Prompt >_ -->
  <!-- Greater-Than Chevron '>' -->
  <path d="M 190 200 L 260 256 L 190 312" 
        fill="none" 
        stroke="#00FF9D" 
        stroke-width="24" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#cyberGlow)" />

  <!-- Terminal Underscore Cursor '_' -->
  <path d="M 285 312 L 345 312" 
        fill="none" 
        stroke="#00F0FF" 
        stroke-width="24" 
        stroke-linecap="round" 
        filter="url(#cyberGlow)" />

  <!-- Micro Cryptographic Keyhole Lock Shackle at Top -->
  <circle cx="256" cy="144" r="16" fill="#00FF9D" />
</svg>
